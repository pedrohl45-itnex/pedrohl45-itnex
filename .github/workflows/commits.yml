name: atualizar-commits

on:
  schedule:
    # 14h, 17h e 20h de Brasília (UTC-3)
    - cron: "0 17,20,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar card de commits
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/update_commits.py
      - name: Commitar se mudou
        run: |
          git config user.name "pedrohl45-itnex"
          git config user.email "pedrohl45-itnex@users.noreply.github.com"
          git add assets/commits.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(stats): atualiza contador de commits"
          git push
